name: Build Blender Model

on:
  workflow_dispatch:
  push:
    paths:
      - "model.py"
      - ".github/workflows/build-model.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Run Blender
        run: |
          blender --background --python model.py

      - name: Prepare output
        run: |
          mkdir -p output

          cp /tmp/model.blend output/model.blend
          cp /tmp/model.glb output/model.glb

          cp /tmp/preview_*.png output/ 2>/dev/null || true

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: blender-model
          path: output/
